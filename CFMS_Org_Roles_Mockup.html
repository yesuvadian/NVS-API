<title>CFMS Organisation Portal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Sora:wght@500;600&display=swap">
<style>
/* Layout: top bar (org, working date, cash position, role) + side menu built from the role's privileges + working pane. */
:root{
  --bg:#f4f6f5; --surface:#ffffff; --sunk:#eaeeec; --line:#d7dedb; --fg:#17221e; --muted:#5c6a64;
  --bar:#1d6b52; --bar-fg:#ffffff; --bar-mute:#bfe0d3; --bar-hi:#175a45;
  --accent:#1d6b52; --accent-fg:#ffffff; --accent-soft:#dcefe7;
  --warn:#9a5b00; --warn-soft:#fbefd9; --bad:#a3302a; --bad-soft:#f8e1df; --ok:#1d6b52; --ok-soft:#dcefe7; --info:#2f5d8a; --info-soft:#e0eaf5;
  --f-display:"Sora","IBM Plex Sans",system-ui,sans-serif; --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1714; --surface:#16211d; --sunk:#1c2924; --line:#2b3b35; --fg:#e3ebe7; --muted:#93a59d;
  --bar:#123f31; --bar-fg:#eaf5f0; --bar-mute:#94c3b1; --bar-hi:#0d3327;
  --accent:#4cbf96; --accent-fg:#06140e; --accent-soft:#173a2d;
  --warn:#e6a94a; --warn-soft:#3a2a12; --bad:#ef8a83; --bad-soft:#3d1c1a; --ok:#4cbf96; --ok-soft:#173a2d; --info:#8ab6e3; --info-soft:#18283a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1714; --surface:#16211d; --sunk:#1c2924; --line:#2b3b35; --fg:#e3ebe7; --muted:#93a59d;
  --bar:#123f31; --bar-fg:#eaf5f0; --bar-mute:#94c3b1; --bar-hi:#0d3327;
  --accent:#4cbf96; --accent-fg:#06140e; --accent-soft:#173a2d;
  --warn:#e6a94a; --warn-soft:#3a2a12; --bad:#ef8a83; --bad-soft:#3d1c1a; --ok:#4cbf96; --ok-soft:#173a2d; --info:#8ab6e3; --info-soft:#18283a; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
a{color:var(--accent)}
.bar{background:var(--bar);color:var(--bar-fg);display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));position:sticky;top:env(safe-area-inset-top,0px);z-index:6}
.org{display:flex;align-items:center;gap:10px;min-width:0}
.org .lg{width:32px;height:32px;border-radius:7px;background:var(--bar-fg);color:var(--bar);display:grid;place-items:center;font-family:var(--f-display);font-weight:600;font-size:12px;flex-shrink:0}
.org b{font-family:var(--f-display);font-weight:600;font-size:14.5px;display:block;line-height:1.2;white-space:nowrap}
.org small{color:var(--bar-mute);font-size:11.5px}
.wd{display:flex;align-items:center;gap:8px;background:var(--bar-hi);border-radius:var(--r);padding:5px 10px}
.wd label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--bar-mute)}
.wd input[type=date]{font:inherit;font-size:13px;background:var(--bar-hi);border:0;color:var(--bar-fg);color-scheme:dark;width:132px;padding:2px 0}
.wd .bk{font-size:11px;background:var(--warn);color:#1b1200;border-radius:9px;padding:0 7px;font-weight:600}
.cash{display:flex;gap:14px;align-items:center;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.cash div{display:flex;flex-direction:column;line-height:1.2}
.cash span{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--bar-mute)}
.cash b{font-weight:500;font-size:13.5px}
.cash .bal b{font-family:var(--f-display);font-size:15px;font-weight:600}
.barr{margin-left:auto;display:flex;align-items:center;gap:10px}
.load-more-row{display:flex;justify-content:center;padding:12px;border-top:1px solid var(--line)}
.pend{font-size:12px;background:var(--bar-fg);color:var(--bar);border-radius:12px;padding:3px 10px;font-weight:600;white-space:nowrap;text-decoration:none}
.who{display:flex;align-items:center;gap:8px}
.who select,.lang-sel{font:inherit;font-size:13px;background:var(--bar-hi);color:var(--bar-fg);border:1px solid rgba(255,255,255,.2);border-radius:var(--r);padding:5px 8px;color-scheme:dark}.lang-sel{width:auto}
.av{width:30px;height:30px;border-radius:50%;background:var(--bar-fg);color:var(--bar);display:grid;place-items:center;font-size:12px;font-weight:600;flex-shrink:0}
.demo{background:var(--warn-soft);color:var(--fg);font-size:12.5px;padding-block:7px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.demo .rs{display:flex;gap:4px;flex-wrap:wrap}
.demo button{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:2px 10px;cursor:pointer}
.demo button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:calc(100% - 100px)}
aside{border-right:1px solid var(--line);background:var(--surface);padding:14px 10px 30px;padding-left:max(10px,env(safe-area-inset-left,0px));min-width:0}
.mg{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:12px 10px 4px}
aside a{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--fg);text-decoration:none;padding:6px 10px;border-radius:var(--r);font-size:13.5px}
aside a:hover{background:var(--sunk)}
aside a.on{background:var(--accent-soft);font-weight:500;box-shadow:inset 3px 0 0 var(--accent)}
aside a .pv{font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.view{padding-block:22px 48px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px;min-width:0;max-width:1200px}
h1{font-family:var(--f-display);font-weight:600;font-size:21px;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-family:var(--f-display);font-weight:600;font-size:15px;margin:0}
h3{font-size:13px;font-weight:600;margin:0}
p{margin:0}
.sub{color:var(--muted);max-width:75ch}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
.head>div:first-child{display:flex;flex-direction:column;gap:3px;min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-size:13px;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:7px 13px;border-radius:var(--r);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-width:0}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pb{padding:16px;display:flex;flex-direction:column;gap:12px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;text-decoration:none;color:inherit}
a.stat:hover{border-color:var(--accent)}
.stat span{font-size:12px;color:var(--muted)}
.stat b{font-family:var(--f-display);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.stat small{font-size:12px;color:var(--muted)}
.stat.hot{border-color:color-mix(in srgb,var(--warn) 55%,var(--line));box-shadow:inset 3px 0 0 var(--warn)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.qa{display:flex;gap:8px;flex-wrap:wrap}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:500;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line);background:var(--sunk);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tfoot td{font-weight:600;background:var(--sunk)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.mono{font-family:var(--f-mono);font-size:12px}
.muted{color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;padding:2px 8px;border-radius:10px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{color:var(--ok);background:var(--ok-soft)}.p-warn{color:var(--warn);background:var(--warn-soft)}.p-bad{color:var(--bad);background:var(--bad-soft)}.p-info{color:var(--info);background:var(--info-soft)}.p-mute{color:var(--muted);background:var(--sunk)}
.tag{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--muted);white-space:nowrap}
.privs{display:flex;gap:3px}
.pv-c{font-family:var(--f-mono);font-size:11px;width:20px;height:20px;border-radius:4px;display:grid;place-items:center;border:1px solid var(--line);color:var(--muted);opacity:.45}
.pv-c.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);opacity:1}
.note{display:flex;gap:10px;padding:10px 14px;border-radius:var(--r);font-size:13px;align-items:flex-start}
.n-info{background:var(--info-soft);border:1px solid color-mix(in srgb,var(--info) 30%,transparent)}
.n-warn{background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent)}
.n-ico{font-family:var(--f-mono);font-weight:600;flex-shrink:0;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;margin-top:1px;color:var(--surface)}
.n-info .n-ico{background:var(--info)}.n-warn .n-ico{background:var(--warn)}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld label,.lbl{font-size:12px;font-weight:500;color:var(--muted)}
.hint{font-size:11.5px;color:var(--muted)}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=date],select,textarea{font:inherit;font-size:13.5px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:7px 10px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.sw{position:relative;display:inline-block;width:34px;height:20px;flex-shrink:0}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw i{position:absolute;inset:0;background:var(--line);border-radius:10px;transition:.15s;cursor:pointer}
.sw i::after{content:"";position:absolute;width:14px;height:14px;left:3px;top:3px;background:var(--surface);border-radius:50%;transition:.15s}
.sw input:checked+i{background:var(--accent)}.sw input:checked+i::after{transform:translateX(14px)}
.sw input:disabled+i{opacity:.5;cursor:not-allowed}
.kv{display:grid;grid-template-columns:minmax(110px,170px) 1fr;gap:6px 16px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0;min-width:0}
.list{display:flex;flex-direction:column}
.li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li>div{min-width:0}
.li small{color:var(--muted);font-size:12px;display:block}
.chip{font:inherit;font-family:var(--f-mono);font-size:11px;width:21px;height:21px;border-radius:4px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;padding:0;opacity:.6}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);opacity:1}
.chip:disabled{cursor:not-allowed;opacity:.18}
.chips{display:flex;gap:3px}
.alloc td{padding:6px 10px}
.denom input{width:90px;text-align:right}
.ro{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);background:var(--sunk);border-radius:var(--r);padding:8px 12px}
.scrim{position:fixed;inset:0;background:rgba(8,14,12,.5);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:10px;width:min(540px,100%);max-height:90vh;overflow:auto;display:flex;flex-direction:column}
.mh{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:3px}
.mb{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.toast{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:var(--r);font-size:13px;z-index:60;max-width:calc(100% - 40px)}
.receipt{font-family:var(--f-mono);font-size:12px;border:1px dashed var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.receipt .rr{display:flex;justify-content:space-between;gap:10px}
@media (min-width:981px){.stats.s5{grid-template-columns:repeat(5,minmax(0,1fr))}}
.tools{display:flex;gap:8px;align-items:center;margin-left:auto;flex-wrap:wrap}
.tsearch{font:inherit;font-size:13px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:5px 10px;width:190px;max-width:100%}
.tsearch:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.xbtn span{font-size:12px;line-height:1}
.tcount,.tupd{font-size:11.5px;color:var(--muted);white-space:nowrap}
.rbtn .ri{display:inline-block;font-size:14px;line-height:1}
.rbtn.spin .ri{animation:rspin .6s linear infinite}
@keyframes rspin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.rbtn.spin .ri{animation:none}}

.bar .rb2{background:var(--bar-hi);color:var(--bar-fg);border-color:rgba(255,255,255,.2)}
@media (max-width:1100px){.cash .sm-hide{display:none}}
@media (max-width:980px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:1fr 1fr}}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  aside{border-right:0;border-bottom:1px solid var(--line);display:flex;overflow-x:auto;gap:4px;padding:8px 16px;padding-left:max(16px,env(safe-area-inset-left,0px))}
  aside .mg{display:none}
  aside a{white-space:nowrap}
  aside a .pv{display:none}
  .bar{position:static;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .barr{margin-left:0}
  .view{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .grid2,.grid3{grid-template-columns:1fr}
  .kv{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="bar">
  <div class="org"><div class="lg">KC</div><div><b>Kaveri Community Welfare Trust</b><small>kaveri.cfms-domain.com</small></div></div>
  <div class="wd"><label for="wdate">Working date</label><input type="date" id="wdate" value="2026-11-15" max="2026-11-15"><span class="bk" id="bk" hidden>Backdated</span></div>
  <div class="cash" id="cash"></div>
  <div class="barr"><select id="languageSel" class="lang-sel" aria-label="Language"><option value="en">English</option><option value="ta">தமிழ்</option></select><button class="btn sm rb2" id="pgRefresh" title="Refresh"><span class="ri" aria-hidden="true">↻</span></button><a class="pend" id="pend" href="#"></a>
    <div class="who"><div class="av" id="av"></div><select id="roleSel" aria-label="Role context"></select></div></div>
</header>
<div class="demo"><b>Mockup:</b> view the portal as <div class="rs" id="rs"></div><span class="muted">Each button opens that role's home dashboard. Menus and buttons follow the role's privileges.</span></div>
<div class="app"><aside id="menu"></aside><main class="view" id="view"></main></div>
<div id="layer"></div>

<script>
(function(){
const $=s=>document.querySelector(s);

function enhance(){

  if(panel.dataset.enh)return;panel.dataset.enh=1;
  const table=panel.querySelector(".tw table");const list=panel.querySelector(".list");
  if(!table&&!list)return;

  const tools=document.createElement("div");tools.className="tools";

  const cfg=paginationConfig(),pageSize=cfg.size;let shown=pageSize;const searches=[...panel.querySelectorAll('input[type="search"],input.psearch')];

  const hasSearch=panel.querySelector('input[placeholder^="Search"]');
  if(!hasSearch&&rows.length>=4&&(!table||table.querySelector("thead th"))){
   const s=document.createElement("input");s.type="search";s.className="tsearch";s.placeholder="Search";s.setAttribute("aria-label","Search this list");
   let empty=null;searches.push(s);

    cnt.textContent=s.value?Math.min(shown,n)+" of "+n:"";if(loadBtn)loadBtn.hidden=cfg.mode!=="Load more"||n<=shown;});

   const sens=/user|member|payroll|audit|platform access/i.test(title);
   [["Excel","xlsx"],["PDF","pdf"]].forEach(([lbl,ext])=>{const b=document.createElement("button");b.type="button";b.className="btn sm xbtn";b.title="Export "+title+" to "+lbl;b.innerHTML='<span aria-hidden="true">'+(ext==="pdf"?"⤓":"⊞")+'</span> '+lbl;

window.addEventListener("hashchange",()=>{render();window.scrollTo(0,0);});
$("#pgRefresh").addEventListener("click",e=>{const b=e.currentTarget;spin(b,()=>{render();toast("Refreshed: cash position, pending work and lists are up to date.");});});
