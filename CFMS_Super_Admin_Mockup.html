<title>CFMS Super Admin Console</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Sora:wght@500;600&display=swap">
<style>
/* Layout: fixed platform sidebar + working pane; org screens use a tab strip; tables and forms are the main material. */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --sunk:#e9edeb; --line:#d6ddd9; --fg:#18231f; --muted:#5d6b65;
  --side:#14261f; --side-fg:#cfdcd6; --side-mute:#86a094; --side-hi:#21392f;
  --accent:#1d6b52; --accent-fg:#ffffff; --accent-soft:#dcefe7;
  --warn:#9a5b00; --warn-soft:#fbefd9; --bad:#a3302a; --bad-soft:#f8e1df; --ok:#1d6b52; --ok-soft:#dcefe7; --info:#2f5d8a; --info-soft:#e0eaf5;
  --f-display:"Sora","IBM Plex Sans",system-ui,sans-serif; --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1714; --surface:#16211d; --sunk:#1c2924; --line:#2b3b35; --fg:#e3ebe7; --muted:#93a59d;
  --side:#0a110e; --side-fg:#c9d7d0; --side-mute:#7a9288; --side-hi:#18271f;
  --accent:#4cbf96; --accent-fg:#06140e; --accent-soft:#173a2d;
  --warn:#e6a94a; --warn-soft:#3a2a12; --bad:#ef8a83; --bad-soft:#3d1c1a; --ok:#4cbf96; --ok-soft:#173a2d; --info:#8ab6e3; --info-soft:#18283a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1714; --surface:#16211d; --sunk:#1c2924; --line:#2b3b35; --fg:#e3ebe7; --muted:#93a59d;
  --side:#0a110e; --side-fg:#c9d7d0; --side-mute:#7a9288; --side-hi:#18271f;
  --accent:#4cbf96; --accent-fg:#06140e; --accent-soft:#173a2d;
  --warn:#e6a94a; --warn-soft:#3a2a12; --bad:#ef8a83; --bad-soft:#3d1c1a; --ok:#4cbf96; --ok-soft:#173a2d; --info:#8ab6e3; --info-soft:#18283a; color-scheme:dark}
*{box-sizing:border-box}
.view a:not(.btn){color:var(--accent)}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--side)}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
aside{background:var(--side);color:var(--side-fg);padding:18px 12px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;padding-left:max(12px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand-mark{width:30px;height:30px;border-radius:7px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-family:var(--f-display);font-weight:600;font-size:13px}
.brand b{font-family:var(--f-display);font-weight:600;font-size:15px;color:#fff;display:block;line-height:1.2}
.brand small{color:var(--side-mute);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
nav{display:flex;flex-direction:column;gap:2px}
nav .grp{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--side-mute);padding:12px 10px 4px}
nav a{color:var(--side-fg);text-decoration:none;padding:7px 10px;border-radius:var(--r);display:flex;justify-content:space-between;align-items:center;font-size:13.5px}
nav a:hover{background:var(--side-hi)}
nav a.on{background:var(--side-hi);color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
nav .cnt{font-family:var(--f-mono);font-size:11px;background:var(--warn);color:#1b1200;border-radius:9px;padding:0 6px}
.me{margin-top:auto;border-top:1px solid var(--side-hi);padding:12px 8px 0;font-size:12px;color:var(--side-mute)}
.me b{color:var(--side-fg);font-weight:500;display:block}
main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.crumbs{font-size:13px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumbs a{color:var(--muted);text-decoration:none}.crumbs a:hover{color:var(--fg)}
.crumbs b{color:var(--fg);font-weight:500}
.topr{display:flex;gap:10px;align-items:center;flex-shrink:0}
.lang-sel{font:inherit;font-size:12px;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
.load-more-row{display:flex;justify-content:center;padding:12px;border-top:1px solid var(--line)}
.mfa{font-size:11.5px;color:var(--ok);background:var(--ok-soft);padding:3px 8px;border-radius:12px;font-weight:500}
.mock{font-size:11.5px;color:var(--muted);border:1px dashed var(--line);padding:3px 8px;border-radius:12px}
.view{padding-block:24px 48px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px;max-width:1240px;width:100%}
h1{font-family:var(--f-display);font-weight:600;font-size:22px;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-family:var(--f-display);font-weight:600;font-size:16px;margin:0}
h3{font-size:13px;font-weight:600;margin:0}
p{margin:0}
.sub{color:var(--muted);max-width:72ch}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.head>div:first-child{display:flex;flex-direction:column;gap:4px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-size:13px;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:7px 13px;border-radius:var(--r);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-width:0}
.panel>.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel>.pb{padding:16px;display:flex;flex-direction:column;gap:14px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.stat span{font-size:12px;color:var(--muted)}
.stat b{font-family:var(--f-display);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.stat small{font-size:12px;color:var(--muted)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:500;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line);background:var(--sunk);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}tbody tr.click:hover td{background:var(--sunk)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:12px}
.muted{color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;padding:2px 8px;border-radius:10px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{color:var(--ok);background:var(--ok-soft)}.p-warn{color:var(--warn);background:var(--warn-soft)}.p-bad{color:var(--bad);background:var(--bad-soft)}.p-info{color:var(--info);background:var(--info-soft)}.p-mute{color:var(--muted);background:var(--sunk)}
.tag{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--muted);white-space:nowrap}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs a{padding:9px 14px;color:var(--muted);text-decoration:none;font-size:13.5px;border-bottom:2px solid transparent;white-space:nowrap;margin-bottom:-1px}
.tabs a:hover{color:var(--fg)}
.tabs a.on{color:var(--fg);border-bottom-color:var(--accent);font-weight:500}
.note{display:flex;gap:10px;padding:10px 14px;border-radius:var(--r);font-size:13px;align-items:flex-start}
.note b{font-weight:600}
.n-info{background:var(--info-soft);color:var(--fg);border:1px solid color-mix(in srgb,var(--info) 30%,transparent)}
.n-warn{background:var(--warn-soft);color:var(--fg);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent)}
.n-ico{font-family:var(--f-mono);font-weight:600;flex-shrink:0;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;margin-top:1px}
.n-info .n-ico{background:var(--info);color:var(--surface)}.n-warn .n-ico{background:var(--warn);color:var(--surface)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld label,.lbl{font-size:12px;font-weight:500;color:var(--muted)}
.fld .hint{font-size:11.5px;color:var(--muted)}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=date],select,textarea{font:inherit;font-size:13.5px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:7px 10px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.affix{display:flex;align-items:stretch}
.affix input{border-radius:var(--r) 0 0 var(--r)}
.affix span{border:1px solid var(--line);border-left:0;background:var(--sunk);padding:0 10px;display:flex;align-items:center;font-size:12.5px;color:var(--muted);border-radius:0 var(--r) var(--r) 0;white-space:nowrap}
.affix.pre input{border-radius:0 var(--r) var(--r) 0}
.affix.pre span{border-left:1px solid var(--line);border-right:0;border-radius:var(--r) 0 0 var(--r)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;flex-wrap:wrap}
.seg button{font:inherit;font-size:12.5px;border:0;background:var(--surface);color:var(--muted);padding:6px 11px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent-soft);color:var(--fg);font-weight:500}
.sw{position:relative;display:inline-block;width:34px;height:20px;flex-shrink:0}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw i{position:absolute;inset:0;background:var(--line);border-radius:10px;transition:.15s;cursor:pointer}
.sw i::after{content:"";position:absolute;width:14px;height:14px;left:3px;top:3px;background:var(--surface);border-radius:50%;transition:.15s}
.sw input:checked+i{background:var(--accent)}
.sw input:checked+i::after{transform:translateX(14px)}
.sw input:focus-visible+i{outline:2px solid var(--accent);outline-offset:2px}
.swrow{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:11px 0;border-bottom:1px solid var(--line)}
.swrow:last-child{border-bottom:0}
.swrow>div{min-width:0}
.swrow p{font-size:12.5px;color:var(--muted)}
.sect{display:flex;flex-direction:column;gap:12px;padding:16px;border-top:1px solid var(--line)}
.sect:first-child{border-top:0}
.sect-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.sect-h h3{font-size:13.5px}
.ref{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
/* workflow designer */
.wf{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px;align-items:start}
.wflist{display:flex;flex-direction:column}
.wflist button{font:inherit;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 14px;cursor:pointer;color:var(--fg);display:flex;flex-direction:column;gap:2px}
.wflist button:last-child{border-bottom:0}
.wflist button:hover{background:var(--sunk)}
.wflist button.on{background:var(--accent-soft)}
.wflist small{color:var(--muted);font-size:11.5px}
.stages{display:flex;align-items:center;gap:0;overflow-x:auto;padding:4px 2px 8px}
.stage{font:inherit;font-size:12.5px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:var(--r);padding:8px 12px;cursor:pointer;white-space:nowrap;display:flex;flex-direction:column;align-items:flex-start;gap:1px;flex-shrink:0}
.stage small{font-size:11px;color:var(--muted)}
.stage.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.arrow{width:22px;height:1px;background:var(--line);flex-shrink:0;position:relative}
.arrow::after{content:"";position:absolute;right:0;top:-3px;border:3.5px solid transparent;border-left-color:var(--muted);border-right:0}
.seqbtn{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--muted);width:24px;height:22px;border-radius:4px;cursor:pointer;line-height:1;padding:0}
.seqbtn:disabled{opacity:.3}
/* matrix */
.mx td,.mx th{padding:6px 8px}
.mx td.mn{white-space:nowrap}
.chips{display:flex;gap:3px}
.chip{font:inherit;font-family:var(--f-mono);font-size:11px;width:21px;height:21px;border-radius:4px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;padding:0;opacity:.55}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);opacity:1}
.chip:disabled{cursor:default}
.mx tr.off td{opacity:.4}
/* wizard */
.steps{display:flex;gap:6px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding:6px 12px 6px 6px;border-radius:20px;background:var(--surface);border:1px solid var(--line)}
.step i{font-style:normal;font-family:var(--f-mono);font-size:11px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--sunk)}
.step.on{color:var(--fg);border-color:var(--accent)}.step.on i{background:var(--accent);color:var(--accent-fg)}
.step.done i{background:var(--accent-soft);color:var(--ok)}
.chk{display:flex;gap:9px;align-items:flex-start;font-size:13px;cursor:pointer}
.chk input{margin-top:3px;accent-color:var(--accent)}
.kv{display:grid;grid-template-columns:minmax(120px,180px) 1fr;gap:6px 16px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
/* modal + toast */
.scrim{position:fixed;inset:0;background:rgba(8,14,12,.5);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:10px;width:min(520px,100%);max-height:90vh;overflow:auto;display:flex;flex-direction:column}
.modal .mh{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:3px}
.modal .mb{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.modal .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.toast{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:var(--r);font-size:13px;z-index:60;max-width:calc(100% - 40px)}
.diff{font-family:var(--f-mono);font-size:12px;background:var(--sunk);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:3px}
.diff .o{color:var(--bad);text-decoration:line-through}.diff .n{color:var(--ok)}
.readonly{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);background:var(--sunk);border-radius:var(--r);padding:8px 12px}
.preview{font-variant-numeric:tabular-nums}
.preview td{padding:6px 10px}
.lbtn{font:inherit;font-size:13px;background:none;border:0;color:var(--accent);cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:2px}
@media (min-width:981px){.stats.s5{grid-template-columns:repeat(5,minmax(0,1fr))}}
.tools{display:flex;gap:8px;align-items:center;margin-left:auto;flex-wrap:wrap}
.tsearch{font:inherit;font-size:13px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:5px 10px;width:190px;max-width:100%}
.tsearch:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.xbtn span{font-size:12px;line-height:1}
.tcount,.tupd{font-size:11.5px;color:var(--muted);white-space:nowrap}
.rbtn .ri{display:inline-block;font-size:14px;line-height:1}
.rbtn.spin .ri{animation:rspin .6s linear infinite}
@keyframes rspin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.rbtn.spin .ri{animation:none}}

@media (max-width:980px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}.wf{grid-template-columns:1fr}}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  aside,main{min-width:0}
  aside{position:static;height:auto;padding:12px 16px;gap:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  nav{flex-direction:row;overflow-x:auto;gap:4px}
  nav .grp,.me{display:none}
  nav a{white-space:nowrap;gap:6px}
  nav a.on{box-shadow:inset 0 -2px 0 var(--accent)}
  .top{position:static;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .view{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .grid2,.grid3{grid-template-columns:1fr}
  .mock{display:none}
  .kv{grid-template-columns:1fr}.kv dt{margin-top:6px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
(function(){

function toast(msg){const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3200);}
function modal(html,onOk){const L=$("#layer");L.innerHTML=`<div class="scrim"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
 L.querySelector(".scrim").addEventListener("click",e=>{if(e.target.classList.contains("scrim")||e.target.dataset.close!==undefined)L.innerHTML="";});
 const ok=L.querySelector("[data-ok]");if(ok)ok.addEventListener("click",()=>{if(onOk(L)!==false)L.innerHTML="";});
 const template=L.querySelector("#trTemplate");if(template)template.addEventListener("click",()=>downloadCsv("cfms-language-import-template.csv",[["text_id","module","text_type","english_text","tamil_text","status"],["LOAN.APPLICATION.TITLE","Loan Management","PAGE","Loan application","","DRAFT"]]));
 const f=L.querySelector("input,select,textarea,button");if(f)f.focus();}
function statusPill(s){const m={Active:"p-ok",Onboarding:"p-info",Suspended:"p-warn",Closed:"p-mute",Published:"p-ok",Draft:"p-warn",approved:"p-ok",pending:"p-warn",retired:"p-mute"};const label={approved:"Approved",pending:"Pending approval",retired:"Retired"}[s]||s;return `<span class="pill ${m[s]||"p-mute"}">${label}</span>`;}
function sw(id,checked,dis){return `<label class="sw"><input type="checkbox" id="${id}" ${checked?"checked":""} ${dis?"disabled":""}><i></i></label>`;}
function seg(name,opts,val){return `<div class="seg" data-seg="${name}">${opts.map(([v,l])=>`<button type="button" data-v="${v}" class="${String(v)===String(val)?"on":""}">${l}</button>`).join("")}</div>`;}
function bindSeg(root,cb){root.querySelectorAll("[data-seg]").forEach(s=>s.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;s.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));cb(s.dataset.seg,b.dataset.v);}));}

 modal(`<div class="mh"><h2>${esc(title)}</h2><p class="sub">Publishing creates a new version for this organisation only. Loans and transactions already in progress keep their current version.</p></div>

 <div class="fld"><label for="reason">Reason for change (required)</label><textarea id="reason" rows="3" placeholder="For example: discussed with organisation leadership on 12 Nov, they want a ₹500 cap"></textarea><span class="hint" id="reasonErr"></span></div>

 <div class="mf"><button class="btn" data-close>Cancel</button><button class="btn pri" data-ok>Publish</button></div>`,L=>{

 </div></div>`,
 after(o){
  const L=o.loans[sel.loan];if(!L._orig)L._orig=JSON.parse(JSON.stringify(L,(k,v)=>k==="_orig"?undefined:v));
  const labels={interest:"Interest rate",min:"Minimum amount",max:"Maximum amount",tmin:"Shortest tenure",tmax:"Longest tenure",fee:"Application fee",feeType:"Fee type",feeVal:"Fee",feeWhen:"Fee collection",lateOn:"Late fee",grace:"Grace period",lateType:"Late fee type",lateVal:"Late fee amount",lateFreq:"Late fee frequency",lateCap:"Late fee cap",esOn:"Early settlement",esPolicy:"Interest policy",esCharge:"Settlement charge",esApproval:"Manager verification",overpay:"Overpayment",defMonths:"Default after (months)",penType:"Penalty type",penVal:"Default penalty",nominee:"Nominee",guarantors:"Guarantors",guarAbove:"Guarantor threshold"};
  const diff=()=>Object.keys(labels).filter(k=>String(L[k])!==String(L._orig[k])).map(k=>[labels[k],String(L._orig[k]),String(L[k])]);
  const sim=()=>{const P=+$("#sAmt").value||0,n=Math.max(1,+$("#sTen").value||1);const I=P*L.interest/100*n/12;const emi=Math.floor((P+I)/n);const last=Math.round(P+I-emi*(n-1));
   const fee=L.fee?(L.feeType==="pct"?Math.round(P*L.feeVal/100):+L.feeVal):0;const late=L.lateOn?Math.min(L.lateType==="pct"?Math.round(emi*L.lateVal/100):+L.lateVal,L.lateCap):0;
   const pen=L.penType==="pct"?Math.round(P*L.penVal/100):+L.penVal;const range=P<L.min||P>L.max||n<L.tmin||n>L.tmax;
   $("#simOut").innerHTML=`${range?`<div class="note n-warn"><span class="n-ico">!</span><div>Outside this loan type's limits (${inr(L.min)}–${inr(L.max)}, ${L.tmin}–${L.tmax} months). Eligibility validation would block it.</div></div>`:""}
   <table class="preview"><tbody><tr><td class="muted">Total interest (flat)</td><td class="num">${inr(Math.round(I))}</td></tr><tr><td class="muted">Instalments 1–${n-1}</td><td class="num">${inr(emi)}</td></tr><tr><td class="muted">Final instalment</td><td class="num">${inr(last)}</td></tr><tr><td class="muted">Application fee</td><td class="num">${fee?inr(fee):"None"}</td></tr><tr><td class="muted">Late fee per instalment</td><td class="num">${late?inr(late):"None"}</td></tr><tr><td class="muted">Default after</td><td class="num">${L.defMonths} months</td></tr><tr><td class="muted">Default penalty</td><td class="num">${inr(pen)}</td></tr></tbody></table><p class="muted" style="font-size:11.5px">EMI rounded down to ₹1; difference goes to the final instalment.</p>`;};
  const drawDraft=()=>{const d=diff();$("#draftBox").innerHTML=d.length?`<div class="diff">${d.map(c=>`<div>${esc(c[0])}: <span class="o">${esc(c[1])}</span> <span class="n">${esc(c[2])}</span></div>`).join("")}</div>`:`<p class="muted" style="font-size:12.5px">No unpublished changes.</p>`;};
  const upd=()=>{sim();drawDraft();};

  $("#sAmt").addEventListener("input",sim);$("#sTen").addEventListener("input",sim);
  $("#rDiscard").addEventListener("click",()=>{const o2=L._orig;Object.assign(L,JSON.parse(JSON.stringify(o2)));L._orig=o2;render();});
  $("#rDraft").addEventListener("click",()=>toast(diff().length?"Draft saved. Not live until published.":"Nothing to save."));
  $("#rPub").addEventListener("click",()=>publishModal(`Publish ${L.name} rules`,diff(),(reason,eff)=>{AUDIT.unshift(["15 Nov 2026 09:20",o.name,"Loan rule published",`${L.name}: ${diff().map(d=>d[0]+" "+d[1]+" → "+d[2]).join("; ")||"no field changes"} (effective ${eff})`,reason]);L.rev=(L.rev||3)+1;delete L._orig;render();toast("Published. New loans use it from "+eff+".");}));
  $("#addLt").addEventListener("click",()=>modal(`<div class="mh"><h2>Add loan type</h2><p class="sub">Starts from a copy of an existing loan type's rules. No code change is needed.</p></div><div class="mb"><div class="fld"><label for="ltn">Loan type name</label><input type="text" id="ltn" placeholder="Festival Loan"></div><div class="fld"><label for="ltc">Copy rules from</label><select id="ltc">${o.loans.map((l,i)=>`<option value="${i}">${esc(l.name)}</option>`).join("")}</select></div></div><div class="mf"><button class="btn" data-close>Cancel</button><button class="btn pri" data-ok>Add as draft</button></div>`,M=>{const n=M.querySelector("#ltn").value.trim();if(!n)return false;const src=o.loans[+M.querySelector("#ltc").value];const c=JSON.parse(JSON.stringify(src,(k,v)=>k==="_orig"?undefined:v));c.name=n;c.code="LN-"+n.slice(0,2).toUpperCase();c.rev=0;o.loans.push(c);sel.loan=o.loans.length-1;render();toast("Loan type added as a draft.");}));
  upd();
 }};

orgTabs.workflows=(o,ro)=>{

   <div class="panel"><div class="ph"><div><h2>Stage: ${esc(st.name)}</h2><span class="muted" style="font-size:12px">Validations run first; if any mandatory validation fails the transaction stays in this stage. Data-changing actions run in one database transaction and roll back on failure.</span></div>

    ${st.actions.length?st.actions.map((a,i)=>`<tr><td><div class="row" style="gap:4px;flex-wrap:nowrap"><span class="mono" style="width:16px">${i+1}</span><button class="seqbtn" data-up="${i}" ${i===0?"disabled":""} aria-label="Move up">↑</button><button class="seqbtn" data-dn="${i}" ${i===st.actions.length-1?"disabled":""} aria-label="Move down">↓</button></div></td>

const translationModules=[...new Set(TRANSLATIONS.map(t=>t.module))].sort();
function translationStatusPill(s){return s==="APPROVED"?'<span class="pill p-ok">Approved</span>':s==="DRAFT"?'<span class="pill p-warn">Draft</span>':'<span class="pill p-bad">Missing Tamil</span>';}
function downloadCsv(name,rows){const csv=rows.map(r=>r.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")).join("\r\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8"}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
function translationRows(){
 const q=(document.querySelector("#trQ")?.value||"").trim().toLowerCase(),m=document.querySelector("#trModule")?.value||"",type=document.querySelector("#trType")?.value||"",status=document.querySelector("#trStatus")?.value||"";
 const rows=TRANSLATIONS.filter(t=>(!q||(t.id+" "+t.en+" "+t.ta).toLowerCase().includes(q))&&(!m||t.module===m)&&(!type||t.type===type)&&(!status||t.status===status)&&(!showMissingTranslations||t.status==="MISSING"));
 document.querySelector("#trRows").innerHTML=rows.map(t=>`<tr><td><span class="mono">${esc(t.id)}</span><div class="muted" style="font-size:11.5px">${esc(t.module)} · ${esc(t.type.replace("_"," "))}</div></td><td>${esc(t.en)}</td><td>${t.ta?esc(t.ta):'<span class="muted">No Tamil translation</span>'}</td><td>${translationStatusPill(t.status)}</td><td class="muted">${esc(t.updated)}</td><td><button class="btn sm" data-edit-translation="${esc(t.id)}">Edit</button></td></tr>`).join("")||'<tr><td colspan="6" class="muted">No text IDs match these filters.</td></tr>';
 document.querySelector("#trShown").textContent=`${rows.length} text ID${rows.length===1?"":"s"}`;
 document.querySelector("#trMissingBtn").classList.toggle("pri",showMissingTranslations);
 document.querySelectorAll("[data-edit-translation]").forEach(b=>b.addEventListener("click",()=>editTranslation(b.dataset.editTranslation)));
}
function editTranslation(id){
 const t=TRANSLATIONS.find(x=>x.id===id);if(!t)return;
 modal(`<div class="mh"><h2>Edit Tamil translation</h2><p class="sub mono">${esc(t.id)} · ${esc(t.module)}</p></div><div class="mb">
  <div class="fld"><label for="trEnglish">English source <span class="tag">${esc(t.type.replace("_"," "))}</span></label><textarea id="trEnglish" rows="2" readonly>${esc(t.en)}</textarea></div>
  <div class="fld"><label for="trTamil">Tamil translation</label><textarea id="trTamil" rows="3" placeholder="Enter the Tamil translation">${esc(t.ta)}</textarea><span class="hint">Keep placeholders such as {member_name} unchanged.</span></div>
  <div class="fld"><label for="trApproval">Review status</label><select id="trApproval"><option value="DRAFT" ${t.status!=="APPROVED"?"selected":""}>Draft</option><option value="APPROVED" ${t.status==="APPROVED"?"selected":""}>Approved</option></select></div>
 </div><div class="mf"><button class="btn" data-close>Cancel</button><button class="btn pri" data-ok>Save translation</button></div>`,L=>{
  const ta=L.querySelector("#trTamil").value.trim(),st=L.querySelector("#trApproval").value;if(!ta&&st==="APPROVED"){toast("Add a Tamil translation before approving it.");return false;}
  const old=t.ta||"(missing)";t.ta=ta;t.status=ta?st:"MISSING";t.updated="15 Nov 2026";AUDIT.unshift(["15 Nov 2026 10:05","Platform","Translation updated",`${t.id}: ${old} → ${ta||"(missing)"} · ${t.status}`,"Language pack draft v"+translationDraftVersion]);
  render();toast(t.status==="APPROVED"?"Translation approved in the draft pack.":"Draft translation saved.");
 });
}

 const approved=TRANSLATIONS.filter(t=>t.status==="APPROVED").length,missing=TRANSLATIONS.filter(t=>t.status==="MISSING").length,draft=TRANSLATIONS.filter(t=>t.status==="DRAFT").length;
 return {crumbs:`<b>Language packs</b>`,html:`
 <div class="head"><div><h1>Language packs</h1><p class="sub">Maintain platform text IDs and approved Tamil translations. Published packs are versioned; organisations receive the current pack when they refresh or sign in.</p></div><div class="row"><button class="btn" id="trExport">Export Excel-compatible CSV</button><button class="btn" id="trImport">Import Excel / CSV</button><button class="btn pri" id="trPublish">Publish v${translationDraftVersion}</button></div></div>
 <div class="note n-info"><span class="n-ico">i</span><div><b>Platform Super Admin only.</b> Organisations use published language packs and cannot edit translations. If a Tamil translation is missing, the app falls back to English.</div></div>
 <div class="stats"><div class="stat"><span>Published pack</span><b>v${publishedTranslationVersion}</b><small>English + Tamil · 01 Nov 2026</small></div><div class="stat"><span>Approved Tamil</span><b>${approved}</b><small>In draft pack v${translationDraftVersion}</small></div><div class="stat"><span>Draft review</span><b>${draft}</b><small>Saved, not approved</small></div><div class="stat"><span>Missing Tamil</span><b>${missing}</b><small>English fallback shown</small></div></div>
 <div class="panel"><div class="ph"><div class="row" style="width:100%"><input type="search" id="trQ" placeholder="Search text ID or English / Tamil text" aria-label="Search translations" style="width:min(300px,100%)"><select id="trModule" aria-label="Filter by module" style="width:auto"><option value="">All modules</option>${translationModules.map(m=>`<option>${esc(m)}</option>`).join("")}</select><select id="trType" aria-label="Filter by text type" style="width:auto"><option value="">All text types</option><option>PAGE</option><option>LABEL</option><option>MESSAGE</option><option>MASTER_DATA</option></select><select id="trStatus" aria-label="Filter by translation status" style="width:auto"><option value="">All statuses</option><option value="APPROVED">Approved</option><option value="DRAFT">Draft</option><option value="MISSING">Missing Tamil</option></select><button class="btn" id="trMissingBtn">Missing translations report</button><span class="muted" id="trShown" style="font-size:12px;margin-left:auto"></span></div></div>
 <div class="tw"><table><thead><tr><th>Text ID</th><th>English source</th><th>Tamil translation</th><th>Status</th><th>Updated</th><th></th></tr></thead><tbody id="trRows"></tbody></table></div></div>
 <p class="muted" style="font-size:12px">A publish creates a new immutable language-pack version. Changes are recorded in the Platform audit log. Developers add English text IDs with each release.</p>`,
 after(){
  ["#trQ","#trModule","#trType","#trStatus"].forEach(s=>$(s).addEventListener(s==="#trQ"?"input":"change",translationRows));
  $("#trMissingBtn").addEventListener("click",()=>{showMissingTranslations=!showMissingTranslations;translationRows();});
  $("#trExport").addEventListener("click",()=>{downloadCsv("cfms-language-pack-draft-v"+translationDraftVersion+".csv",[["text_id","module","text_type","english_text","tamil_text","status"],...TRANSLATIONS.map(t=>[t.id,t.module,t.type,t.en,t.ta,t.status])]);toast("Language catalogue exported as an Excel-compatible CSV.");AUDIT.unshift(["15 Nov 2026 10:06","Platform","Translations exported","Language catalogue exported to Excel-compatible CSV",""]);});
  $("#trImport").addEventListener("click",()=>modal(`<div class="mh"><h2>Import translations</h2><p class="sub">Upload a CSV or Excel file using the platform language template. Imported text is saved as draft for review.</p></div><div class="mb"><div class="fld"><label for="trFile">Import file</label><input id="trFile" type="file" accept=".csv,.xlsx,.xls"></div><button class="lbtn" id="trTemplate" type="button" style="align-self:flex-start">Download the CSV import template</button></div><div class="mf"><button class="btn" data-close>Cancel</button><button class="btn pri" data-ok>Import as draft</button></div>`,L=>{const f=L.querySelector("#trFile").files[0];if(!f){toast("Choose a file to import.");return false;}AUDIT.unshift(["15 Nov 2026 10:06","Platform","Translations imported",`${f.name} imported to language pack draft v${translationDraftVersion}`,""]);toast("Import queued for validation. Valid rows will be added to the draft pack.");}));
  $("#trPublish").addEventListener("click",()=>{const missingNow=TRANSLATIONS.filter(t=>t.status==="MISSING").length;modal(`<div class="mh"><h2>Publish Tamil language pack v${translationDraftVersion}</h2><p class="sub">This makes the approved translations available to every organisation on the next refresh or sign in.</p></div><div class="mb"><div class="diff"><div>${approved} approved translation${approved===1?"":"s"} will be published</div><div>${missingNow} missing Tamil item${missingNow===1?"":"s"} will use English fallback</div></div><div class="fld"><label for="trReason">Reason for publishing (required)</label><textarea id="trReason" rows="2" placeholder="For example: Tamil review completed for release 2026.11"></textarea></div></div><div class="mf"><button class="btn" data-close>Cancel</button><button class="btn pri" data-ok>Publish pack</button></div>`,L=>{const reason=L.querySelector("#trReason").value.trim();if(reason.length<5){toast("Enter a reason for the language-pack change.");return false;}AUDIT.unshift(["15 Nov 2026 10:10","Platform","Language pack published",`Tamil language pack v${translationDraftVersion} published; ${missingNow} missing item(s) use English fallback`,reason]);publishedTranslationVersion=translationDraftVersion;translationDraftVersion++;render();toast("Language pack published. Organisations receive it on refresh or sign in.");});});
  translationRows();
 }};
};

views.audit=()=>({crumbs:`<b>Platform audit log</b>`,html:`
 <div class="head"><div><h1>Platform audit log</h1><p class="sub">Every configuration change you make, with who, when, why and the effective date. Organisation entries are mirrored into that organisation's own log.</p></div><select id="aOrg" style="width:auto"><option value="">All organisations</option>${ORGS.map(o=>`<option>${esc(o.name)}</option>`).join("")}<option>Platform</option></select></div>
 <div id="aBox">${auditTable(AUDIT,true)}</div>`,
 after(){$("#aOrg").addEventListener("change",e=>{$("#aBox").innerHTML=auditTable(e.target.value?AUDIT.filter(a=>a[1]===e.target.value):AUDIT,true);enhance();});}
});

/* search + refresh enhancer: runs after every render */
function nowStr(){const d=new Date();return d.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"});}
function refreshBtn(label){const b=document.createElement("button");b.type="button";b.className="btn sm rbtn";b.title="Refresh";b.setAttribute("aria-label","Refresh");b.innerHTML='<span class="ri" aria-hidden="true">↻</span>'+(label?'<span>'+label+'</span>':"");return b;}
function spin(b,done){b.classList.add("spin");b.disabled=true;setTimeout(()=>{b.classList.remove("spin");b.disabled=false;done&&done();},600);}
function paginationConfig(){const m=(location.hash||"").match(/^#org-([a-z0-9]+)-/),o=m&&ORGS.find(x=>x.id===m[1]),s=o?o.settings:DEFAULTS,n=parseInt(s.listPageSize,10);return {mode:s.listMode||"Load more",size:[25,50,100].includes(n)?n:25};}
function enhance(){
 const view=document.getElementById("view");
 view.querySelectorAll(".panel").forEach(panel=>{
  if(panel.dataset.enh)return;panel.dataset.enh=1;
  const table=panel.querySelector(".tw table");const list=panel.querySelector(".list");
  if(!table&&!list)return;
  if(table&&table.querySelector("tbody input:not([type=checkbox]), tbody select, tbody textarea"))return; /* forms: no search/refresh */
  if(table&&table.closest(".preview,.alloc,.denom"))return;
  let ph=panel.querySelector(":scope > .ph");
  if(!ph){ph=document.createElement("div");ph.className="ph";ph.innerHTML="<span></span>";panel.insertBefore(ph,panel.firstChild);}
  const tools=document.createElement("div");tools.className="tools";
  const rows=table?[...table.querySelectorAll("tbody tr")]:[...list.querySelectorAll(":scope > .li")];
  const cfg=paginationConfig(),pageSize=cfg.size;let shown=pageSize;
  const searches=[...panel.querySelectorAll('input[type="search"],input.psearch')];
  const visibleRows=()=>{const q=searches.map(x=>x.value.trim().toLowerCase()).filter(Boolean).join(" ");const matched=rows.filter(r=>!q||r.textContent.toLowerCase().includes(q));if(cfg.mode==="Show all")shown=matched.length;rows.forEach(r=>r.hidden=!matched.includes(r)||matched.indexOf(r)>=shown);return matched;};
  const hasSearch=panel.querySelector('input[placeholder^="Search"]');
  if(!hasSearch&&rows.length>=4&&(!table||table.querySelector("thead th"))){
   const s=document.createElement("input");s.type="search";s.className="tsearch";s.placeholder="Search";s.setAttribute("aria-label","Search this list");
   let empty=null;
   searches.push(s);s.addEventListener("input",()=>{shown=pageSize;const matches=visibleRows(),n=matches.length;
    if(empty){empty.remove();empty=null;}
    if(!n){if(table){empty=document.createElement("tr");empty.innerHTML=`<td colspan="${table.querySelectorAll("thead th").length||1}" class="muted">No matches for “${esc(s.value)}”.</td>`;table.querySelector("tbody").appendChild(empty);}else{empty=document.createElement("div");empty.className="li muted";empty.textContent="No matches for “"+s.value+"”.";list.appendChild(empty);}}
    cnt.textContent=s.value?Math.min(shown,n)+" of "+n:"";if(loadBtn)loadBtn.hidden=cfg.mode!=="Load more"||n<=shown;});
   const cnt=document.createElement("span");cnt.className="tcount";
   tools.appendChild(s);tools.appendChild(cnt);
  }
  const loadArea=document.createElement("div");loadArea.className="load-more-row";const loadBtn=document.createElement("button");loadBtn.type="button";loadBtn.className="btn sm";loadBtn.hidden=cfg.mode!=="Load more"||rows.length<=pageSize;const updateLoad=matches=>{loadBtn.hidden=cfg.mode!=="Load more"||matches.length<=shown;loadBtn.textContent=(uiLanguage==="ta"?"மேலும் ஏற்று":"Load more")+" ("+Math.min(shown,matches.length)+" / "+matches.length+")";};loadBtn.addEventListener("click",()=>{shown+=pageSize;updateLoad(visibleRows());});loadArea.appendChild(loadBtn);if(rows.length>pageSize&&cfg.mode==="Load more")panel.appendChild(loadArea);
  searches.forEach(s=>s.addEventListener("input",()=>{shown=pageSize;updateLoad(visibleRows());}));updateLoad(visibleRows());
  const upd=document.createElement("span");upd.className="tupd";upd.textContent="Updated "+nowStr();
  const rb=refreshBtn("");rb.addEventListener("click",()=>spin(rb,()=>{upd.textContent="Updated "+nowStr();toast("Refreshed.");}));
  if(table&&table.querySelector("thead th")||list){
   const title=(ph.querySelector("h2")||{}).textContent||(document.querySelector(".view h1")||{}).textContent||"list";
   const sens=/user|member|payroll|audit|platform access/i.test(title);
   [["Excel","xlsx"],["PDF","pdf"]].forEach(([lbl,ext])=>{const b=document.createElement("button");b.type="button";b.className="btn sm xbtn";b.title="Export "+title+" to "+lbl;b.innerHTML='<span aria-hidden="true">'+(ext==="pdf"?"⤓":"⊞")+'</span> '+lbl;
    b.addEventListener("click",()=>{const q=(tools.querySelector(".tsearch")||{}).value;toast("Exporting “"+title.trim()+"” to "+lbl+" (."+ext+")"+(q?", filtered by “"+q+"”":"")+"."+(sens?" Export recorded in the audit log.":""));});tools.appendChild(b);});
  }
  tools.appendChild(upd);tools.appendChild(rb);
  ph.appendChild(tools);
 });
}

/* ---------- router ---------- */
function render(){
 const h=(location.hash||"#orgs").slice(1);route=h;let v,navKey=h;
 const m=h.match(/^org-([a-z0-9]+)-([a-z]+)$/);
 if(m){const o=ORGS.find(x=>x.id===m[1]);if(o&&ORG_TABS.some(t=>t[0]===m[2])){v=orgView(o,m[2]);navKey="orgs";}}
 if(!v)v=(views[h]||views.orgs)();
 if(!views[h]&&!m)navKey="orgs";
 $("#crumbs").innerHTML=v.crumbs;$("#view").innerHTML=v.html;
 document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on",a.dataset.k===navKey));
 const pc=ACTIONS.filter(a=>a.status==="pending").length;$("#pendCnt").textContent=pc;$("#pendCnt").hidden=!pc;
 if(v.after)v.after();
 enhance();
 applyLanguage();
}
let lastOrgTab="";
window.addEventListener("hashchange",()=>{const k=location.hash.replace(/-(overview|users|modules|roles|settings|rules|workflows|approvals|actions|features|audit)$/,"");if(k!==lastOrgTab){sel.wf=0;sel.stage=2;sel.loan=0;lastOrgTab=k;}render();window.scrollTo(0,0);});
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#layer").innerHTML="";});
$("#pgRefresh").addEventListener("click",e=>{const b=e.currentTarget;spin(b,()=>{render();toast("Page refreshed.");});});
render();
})();
</script>
