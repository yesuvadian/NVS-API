[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "cfms-super-admin-api"
version = "0.1.0"
description = "CFMS Super Administrator API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "psycopg[binary,pool]>=3.2,<4.0",
    "pydantic-settings>=2.7,<3.0",
    "email-validator>=2.2,<3.0",
    "PyJWT[crypto]>=2.10,<3.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3,<9.0",
    "pytest-cov>=5.0,<7.0",
    "pytest-html>=4.1,<5.0",
    "httpx>=0.27,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "postgres: needs the local PostgreSQL database configured in .env (skipped when unreachable)",
    "concurrency: two-session race tests; they commit a throw-away organisation and close it afterwards",
]

[tool.coverage.run]
source = ["app", "seed", "jobs"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
